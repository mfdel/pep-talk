name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Dry run of the sample speech
        run: sh scripts/pep_talk.sh build examples/sample.md --dry-run

      - name: Mock end-to-end build (no API key, no network)
        run: |
          sh scripts/pep_talk.sh build examples/sample.md --mock
          ffprobe -v error -show_entries format=duration:format_tags=title out/sample.mp3
